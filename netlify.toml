# Netlify is on its way out. usejefe.com is a Cloudflare Worker (see
# wrangler.jsonc). Until usejefe.com is verified serving, Netlify keeps
# serving the same pages at getjefe.netlify.app, because App Store Connect and
# every shipped build link there (/privacy.html, /terms, /terms.html, /).
# The pages moved into public/, so that is the publish directory.
# The follow-up PR turns this into a 301 forwarder to usejefe.com. It must
# not land before usejefe.com serves, or every old link forwards to nothing.

[build]
  publish = "public"
  command = ""
